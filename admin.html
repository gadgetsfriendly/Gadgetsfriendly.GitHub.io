<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GadgetsFriendly — Admin</title>
<style>
:root{--bg:#070809;--p:#0d1014;--l:#272c32;--t:#f5f5f5;--m:#9da3ab;--r:#ff2638;--g:#37d67a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{position:sticky;top:0;z-index:5;padding:16px 22px;background:#090a0ceb;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px}.logo{font-weight:900}.logo span{color:var(--r)}.btn{background:#11151a;color:#fff;border:1px solid #394049;border-radius:9px;padding:10px 14px}.primary{background:var(--r);border-color:var(--r)}.danger{color:#ff9ba4}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 65px)}.side{padding:18px;border-right:1px solid var(--l)}.nav{width:100%;padding:12px;text-align:left;background:transparent;color:#bbb;border:1px solid transparent;border-radius:9px;margin:4px 0}.nav.active,.nav:hover{background:#14181d;color:#fff;border-color:#30363e}.main{max-width:1400px;width:100%;padding:28px;margin:auto}.card{background:linear-gradient(145deg,#11151a,#0c0f12);border:1px solid var(--l);border-radius:15px;padding:20px;margin-bottom:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#0d1014;border:1px solid var(--l);border-radius:12px}.num{font-size:28px;font-weight:800;margin-top:7px}.muted{color:var(--m)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;background:#080a0d;color:#fff;border:1px solid #30363e;border-radius:8px;padding:11px}.field textarea{min-height:100px}.actions{display:flex;gap:8px;margin-top:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid #252a30;text-align:left;vertical-align:top}.table th{color:#8f969f;font-size:11px}.thumb{max-width:70px;max-height:70px;object-fit:contain}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#22272d;font-size:10px}.paid{background:#10291b;color:#8af0b5}.new{background:#381318;color:#ff9aa4}.toast{position:fixed;right:15px;bottom:15px;background:#171c22;border:1px solid #414851;padding:12px;border-radius:9px;display:none}.toast.show{display:block}@media(max-width:850px){.layout{display:block}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--l);position:sticky;top:64px;background:#090b0e;z-index:4}.nav{min-width:120px;text-align:center}.grid4{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:14px}}
</style></head><body>
<div id="login" style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(420px,100%)"><div class="logo">GADGETS<span>FRIENDLY</span></div><h1>Admin Portal</h1><p class="muted">Supabase Auth</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="login()">Sign in</button></div></div>
<div id="app" class="hidden"><header class="top"><div class="logo">GADGETS<span>FRIENDLY</span></div><div><a class="btn" href="index.html">Main Website</a> <button class="btn" onclick="logout()">Logout</button></div></header>
<div class="layout"><aside class="side"><button class="nav active" onclick="tab('dash',this)">Dashboard</button><button class="nav" onclick="tab('prod',this)">Products</button><button class="nav" onclick="tab('rep',this)">Repairs</button><button class="nav" onclick="tab('buy',this)">Purchases</button></aside>
<main class="main">
<section id="dash"><h1>Operations Dashboard</h1><div class="grid4"><div class="stat">Products<div class="num" id="nprod">0</div></div><div class="stat">New Arrivals<div class="num" id="nnew">0</div></div><div class="stat">Open Repairs<div class="num" id="nrep">0</div></div><div class="stat">Unfinished Orders<div class="num" id="nbuy">0</div></div></div><div class="card"><h2>Recent Orders</h2><div id="recent"></div></div></section>
<section id="prod" class="hidden"><h1>Products</h1><div class="card"><h2 id="ptitle">Add Product</h2><div class="form"><div class="field"><label>Name</label><input id="pn"></div><div class="field"><label>Category</label><select id="pc"><option value="mac">Mac / MacBook / Laptops</option><option value="apple">iPhone / iPad / Apple Watch / AirPods</option><option value="accessories">Accessories</option></select></div><div class="field"><label>Price ₦</label><input id="pp" type="number" min="0"></div><div class="field"><label>Image</label><input id="pi" type="file" accept="image/*"></div><div class="field"><label>Identifier type</label><select id="pit"><option value="none">None</option><option value="serial">Serial</option><option value="imei">IMEI</option></select></div><div class="field"><label>Private Serial / IMEI</label><input id="piv"></div><div class="field full"><label>Description</label><textarea id="pd"></textarea></div><label><input id="pnw" type="checkbox"> New Arrival</label></div><div class="actions"><button class="btn primary" onclick="saveProduct()">Save Product</button><button class="btn" onclick="clearProduct()">Clear</button></div></div><div class="card"><h2>Inventory</h2><div id="plist"></div></div></section>
<section id="rep" class="hidden"><h1>Repair Requests</h1><div class="actions"><button class="btn danger" onclick="clearRepairs()">Clear Completed Jobs</button></div><div class="card"><div id="rlist"></div></div></section>
<section id="buy" class="hidden"><h1>Purchases</h1><div class="actions"><button class="btn danger" onclick="clearPurchases()">Clear Completed Purchases</button></div><div class="card"><div id="blist"></div></div></section>
</main></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://qgnibojnkzgakzruntza.supabase.co',K='sb_publishable_M6f8PKxb4tAp7BZmV8zdKw_EgLl_7Yk',WA='2349071073992';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});let P=[],R=[],B=[],edit=null;
const $=x=>document.getElementById(x),E=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),N=x=>'₦'+Number(x||0).toLocaleString('en-NG'),T=x=>{let e=$('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)};
async function login(){try{let{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(data.user?.app_metadata?.role!=='admin'){await db.auth.signOut();throw Error('This account is not an admin.')}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}catch(e){T(e.message)}}
async function logout(){await db.auth.signOut();location.reload()}
function tab(id,b){['dash','prod','rep','buy'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function load(){let[a,b,c]=await Promise.all([db.from('products').select('*').order('created_at',{ascending:false}),db.from('repairs').select('*').order('created_at',{ascending:false}),db.from('purchases').select('*').order('created_at',{ascending:false})]);if(a.error||b.error||c.error)return T((a.error||b.error||c.error).message);P=a.data||[];R=b.data||[];B=c.data||[];render()}
function render(){let pending=B.filter(x=>x.status!=='completed');$('nprod').textContent=P.length;$('nnew').textContent=P.filter(x=>x.is_new).length;$('nrep').textContent=R.filter(x=>x.status!=='completed').length;$('nbuy').textContent=pending.length;$('recent').innerHTML=table(pending.slice(0,5),['Customer','Total','Payment','Status'],x=>`<tr><td>${E(x.name)}</td><td>${N(x.total)}</td><td>${pay(x.payment_status)}</td><td>${badge(x.status)}</td></tr>`);renderProducts();renderRepairs();renderPurchases()}
function table(a,h,row){if(!a.length)return'<p class="muted">None.</p>';return'<div class="tablewrap"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+a.map(row).join('')+'</tbody></table></div>'}
function badge(s){return'<span class="badge '+(s==='completed'?'paid':'new')+'">'+E(s||'new')+'</span>'}function pay(s){return'<span class="badge '+(s==='paid'?'paid':'')+'">'+E(s||'unpaid')+'</span>'}
async function imgBlob(f){if(!f)return null;return f}
async function saveProduct(){try{let name=$('pn').value.trim(),cat=$('pc').value,price=Number($('pp').value),desc=$('pd').value.trim(),typ=$('pit').value,ident=$('piv').value.trim(),nw=$('pnw').checked;if(!name||!Number.isFinite(price)||price<0)return T('Enter product name and valid price.');if(typ!=='none'&&!ident)return T('Enter serial/IMEI or choose None.');let id=edit;if(id){let q=await db.from('products').update({name,category:cat,price,description:desc,is_new:nw,updated_at:new Date().toISOString()}).eq('id',id);if(q.error)throw q.error}else{let q=await db.from('products').insert({name,category:cat,price,description:desc,is_new:nw}).select('id').single();if(q.error)throw q.error;id=q.data.id}let f=$('pi').files[0];if(f){let ext=f.type.includes('png')?'png':'jpg',path='products/'+id+'-'+Date.now()+'.'+ext,q=await db.storage.from('product-images').upload(path,f,{contentType:f.type});if(q.error)throw q.error;q=await db.from('products').update({image_path:path}).eq('id',id);if(q.error)throw q.error}let q=await db.from('product_private').upsert({product_id:id,identifier_type:typ,identifier:typ==='none'?null:ident,updated_at:new Date().toISOString()},{onConflict:'product_id'});if(q.error)throw q.error;clearProduct();await load();T('Product saved.')}catch(e){T(e.message)}}
async function editProduct(id){let p=P.find(x=>x.id===id);if(!p)return;edit=id;$('pn').value=p.name||'';$('pc').value=p.category;$('pp').value=p.price;$('pd').value=p.description||'';$('pnw').checked=!!p.is_new;let q=await db.from('product_private').select('*').eq('product_id',id).maybeSingle();$('pit').value=q.data?.identifier_type||'none';$('piv').value=q.data?.identifier||'';$('ptitle').textContent='Edit Product';tab('prod',document.querySelectorAll('.nav')[1])}
async function delProduct(id){if(!confirm('Delete this product?'))return;let q=await db.from('products').delete().eq('id',id);if(q.error)return T(q.error.message);await load();T('Product deleted.')}
function clearProduct(){edit=null;['pn','pp','pd','piv'].forEach(x=>$(x).value='');$('pc').value='mac';$('pit').value='none';$('pnw').checked=false;$('pi').value='';$('ptitle').textContent='Add Product'}
function renderProducts(){let rows=P.map(p=>`<tr><td>${p.image_path?`<img class=thumb src="${E(db.storage.from('product-images').getPublicUrl(p.image_path).data.publicUrl)}">`:'—'}</td><td>${E(p.name)}<br><small>${E(p.description||'')}</small></td><td>${E(p.category)}</td><td>${N(p.price)}</td><td>${p.is_new?'YES':'NO'}</td><td><button class="btn" onclick="editProduct('${p.id}')">Edit</button> <button class="btn danger" onclick="delProduct('${p.id}')">Delete</button></td></tr>`);$('plist').innerHTML=table(P,['Image','Product','Category','Price','New','Actions'],(_,i)=>rows[i])}
async function setStatus(t,id,s){let q=await db.from(t).update({status:s,updated_at:new Date().toISOString()}).eq('id',id);if(q.error)T(q.error.message);else load()}
async function del(t,id){if(!confirm('Delete this record?'))return;let q=await db.from(t).delete().eq('id',id);if(q.error)T(q.error.message);else load()}
async function clearRepairs(){if(!confirm('Clear completed jobs?'))return;let q=await db.from('repairs').delete().eq('status','completed');if(q.error)T(q.error.message);else load()}
async function clearPurchases(){if(!confirm('Clear completed purchases?'))return;let q=await db.from('purchases').delete().eq('status','completed');if(q.error)T(q.error.message);else load()}
function renderRepairs(){$('rlist').innerHTML=table(R,['Customer','Device','Status','Actions'],x=>`<tr><td>${E(x.name)}<br>${E(x.phone)}</td><td>${E(x.device)} — ${E(x.model)}<br>${E(x.problem)}</td><td><select onchange="setStatus('repairs','${x.id}',this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='in-progress'?'selected':''}>in-progress</option><option ${x.status==='completed'?'selected':''}>completed</option></select></td><td><button class="btn" onclick="window.open('https://wa.me/${WA}?text='+encodeURIComponent('GadgetsFriendly Repair\\nName: ${E(x.name)}\\nPhone: ${E(x.phone)}\\nDevice: ${E(x.device)}\\nProblem: ${E(x.problem)}'))">WhatsApp Store</button> <button class="btn danger" onclick="del('repairs','${x.id}')">Delete</button></td></tr>`)}
function renderPurchases(){$('blist').innerHTML=table(B,['Customer','Items','Total','Payment','Status','Receipt','Delete'],x=>`<tr><td>${E(x.name)}<br>${E(x.phone)}<br>${E(x.email||'')}</td><td>${(x.items||[]).map(i=>E(i.name)).join(', ')}</td><td>${N(x.total)}</td><td>${pay(x.payment_status)}<br><small>${E(x.payment_reference||'')}</small></td><td><select onchange="setStatus('purchases','${x.id}',this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='in-progress'?'selected':''}>in-progress</option><option ${x.status==='completed'?'selected':''}>completed</option></select></td><td><button class="btn" ${x.payment_status==='paid'?'':'disabled'} onclick="receipt('${x.id}')">Receipt</button></td><td><button class="btn danger" onclick="del('purchases','${x.id}')">Delete</button></td></tr>`)}
async function receipt(id){
  const p=B.find(x=>x.id===id);
  if(!p||p.payment_status!=='paid'){
    T('Receipt is available after payment is verified.');
    return;
  }

  // Open the window immediately from the user click.
  // iPhone/Safari can block a popup if window.open() happens after an await.
  const w=window.open('about:blank','_blank');
  if(!w){
    T('Please allow pop-ups for the GadgetsFriendly receipt.');
    return;
  }

  w.document.write('<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GadgetsFriendly Receipt</title></head><body style="font-family:Arial,sans-serif;padding:30px;max-width:760px;margin:auto;color:#111"><h1>GADGETS<span style="color:#e21f32">FRIENDLY</span></h1><p>Loading receipt…</p></body></html>');
  w.document.close();

  try{
    const ids=(p.items||[]).map(x=>x.id).filter(Boolean);
    const q=ids.length
      ? await db.from('product_private').select('*').in('product_id',ids)
      : {data:[]};

    if(q.error) throw q.error;

    const m=new Map((q.data||[]).map(x=>[x.product_id,x]));
    const rows=(p.items||[]).map(x=>{
      const priv=m.get(x.id);
      const identifier=priv && priv.identifier_type!=='none'
        ? (priv.identifier||'—')
        : '—';
      return `<tr>
        <td>${E(x.name)}</td>
        <td>${N(x.price)}</td>
        <td>${E(identifier)}</td>
      </tr>`;
    }).join('');

    const date=p.created_at
      ? new Date(p.created_at).toLocaleString('en-NG')
      : new Date().toLocaleString('en-NG');

    const html=`<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GadgetsFriendly Receipt</title>
<style>
body{font:14px Arial,sans-serif;max-width:760px;margin:auto;padding:30px;color:#111}
h1{margin:0 0 4px;font-size:30px}
h1 span{color:#e21f32}
.subtitle{color:#666;margin-top:0}
hr{border:0;border-top:1px solid #ddd;margin:22px 0}
.meta{line-height:1.8}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:11px 8px;border-bottom:1px solid #ddd;text-align:left}
th{font-size:12px;color:#666}
.total{text-align:right;font-size:20px;font-weight:800;margin-top:20px}
.thanks{margin-top:25px;color:#555}
.print{padding:12px 18px;margin-top:20px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer}
@media print{.print{display:none}body{padding:0}}
</style>
</head>
<body>
<h1>GADGETS<span>FRIENDLY</span></h1>
<p class="subtitle">Technology. Carefully Chosen.</p>
<hr>
<div class="meta">
<b>Receipt / Order:</b> ${E(p.id)}<br>
<b>Date:</b> ${E(date)}<br>
<b>Customer:</b> ${E(p.name)}<br>
<b>Phone:</b> ${E(p.phone)}<br>
<b>Email:</b> ${E(p.email||'—')}<br>
<b>Payment:</b> PAID<br>
<b>Paystack reference:</b> ${E(p.payment_reference||'—')}
</div>
<hr>
<table>
<thead><tr><th>Product</th><th>Price</th><th>Serial / IMEI</th></tr></thead>
<tbody>${rows}</tbody>
</table>
<div class="total">Total: ${N(p.total)}</div>
${p.note?`<p><b>Order note:</b> ${E(p.note)}</p>`:''}
<p class="thanks">Thank you for choosing GadgetsFriendly.</p>
<button class="print" onclick="window.print()">Print / Save as PDF</button>
</body>
</html>`;

    w.document.open();
    w.document.write(html);
    w.document.close();
  }catch(err){
    console.error('Receipt error:',err);
    try{
      w.document.open();
      w.document.write('<!doctype html><html><body style="font-family:Arial;padding:30px"><h2>Receipt could not be loaded</h2><p>Please return to the Admin Purchases page and try again.</p></body></html>');
      w.document.close();
    }catch(_){}
    T('Could not load the receipt: '+(err.message||'Please try again.'));
  }
}

(async()=>{let{data}=await db.auth.getSession();if(data.session?.user?.app_metadata?.role==='admin'){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}})();
</script></body></html>
