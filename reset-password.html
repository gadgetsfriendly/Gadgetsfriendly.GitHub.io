<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Reset your password | GadgetsFriendly</title>
<style>
:root{color-scheme:dark light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#f8fafc;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:22px}.card{width:min(100%,460px);background:linear-gradient(135deg,#171c25,#10141b);padding:32px 24px;border:1px solid #414b59;border-radius:22px;box-shadow:0 24px 70px #0007}.brand{font-weight:850;letter-spacing:-.7px;font-size:23px}.brand b{color:#f32d44}.sub{color:#c5ccd6}.status{padding:11px 13px;border-radius:10px;background:#202938;margin:20px 0;color:#fff}.err{background:#41232c;color:#ffe0e4}label{display:block;font-weight:700;margin:17px 0 7px}input{width:100%;min-height:50px;padding:12px;border:1px solid #748093;border-radius:11px;background:#0c1016;color:white;font-size:16px}button{border-radius:12px;min-height:50px;width:100%;margin-top:21px;background:#eef2f6;color:#111827;font-weight:800;border:1px solid #aab3c1;font-size:16px}button:disabled{opacity:.65}a{color:#ebedf2}form[hidden],.status[hidden]{display:none!important}
@media(prefers-color-scheme:light){body{background:#f7f9fc;color:#141a23}.card{background:#fff;border-color:#ccd4de;box-shadow:0 20px 65px #1a263322}.sub{color:#394553}.status{background:#eef2f8;color:#101827}.err{background:#ffecf0;color:#99192c}input{background:#fff;color:#121722;border-color:#8996a8}button{background:#202b3d;color:white}}
</style></head><body><main class="card"><div class="brand"><b>G</b>ADGETSFRIENDLY</div><h1>Reset your password</h1><p class="sub">Enter a new password for your account.</p><div id="status" class="status" role="status" aria-live="polite">Checking your secure reset link…</div>
<form id="form" hidden><label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><label for="pw2">Confirm new password</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat new password"><button id="submit" type="submit">Update password</button></form><p><a href="/">Back to GadgetsFriendly</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const url='https://qgnibojnkzgakzruntza.supabase.co', key='sb_publishable_M6f8PKxb4tAp7BZmV8zdKw_EgLl_7Yk';
const status=document.getElementById('status'),form=document.getElementById('form'),submit=document.getElementById('submit');
function say(msg,error=false){status.hidden=false;status.textContent=msg;status.classList.toggle('err',error)}
function cleanUrl(){try{history.replaceState({},document.title,location.pathname)}catch(_){}}
let ready=false;
(async()=>{
 try{
  if(!window.supabase)throw new Error('Could not load secure account service. Check your connection and reload.');
  const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const err=params.get('error_description')||hash.get('error_description');
  if(err)throw new Error('This reset link is invalid or expired. Request a new password-reset email.');
  let {data:{session},error:sessionError}=await client.auth.getSession();
  if(!session && params.get('code')){
   const result=await client.auth.exchangeCodeForSession(params.get('code'));
   if(result.error)throw result.error;
   session=result.data.session;
  }
  if(sessionError && !session)throw sessionError;
  if(!session)throw new Error('The reset link is expired or was opened without a valid session. Request a fresh link and open it in the same browser.');
  ready=true;cleanUrl();say('Your link is verified. Choose a new password.');form.hidden=false;
  form.addEventListener('submit',async e=>{
   e.preventDefault();if(!ready)return;
   const p=document.getElementById('pw').value,q=document.getElementById('pw2').value;
   if(p!==q){say('Passwords do not match.',true);return}
   if(p.length<8){say('Password must have at least 8 characters.',true);return}
   submit.disabled=true;submit.textContent='Updating password…';
   try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;ready=false;form.hidden=true;await client.auth.signOut();say('Password changed successfully. Return to GadgetsFriendly and sign in with your new password.');}
   catch(error){say(error.message||'Could not change password. Please request a new link.',true)}
   finally{submit.disabled=false;submit.textContent='Update password'}
  });
 }catch(error){say(error.message||'The reset link could not be verified. Please request a new one.',true)}
})();
</script></body></html>
